name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install pnpm globally
        run: |
          npm install -g pnpm
          echo "$(npm bin -g)" >> $GITHUB_PATH

      - name: Install dependencies
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci_db
        run: pnpm install

      - name: Lint
        run: pnpm lint

      - name: Build
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci_db
          BETTER_AUTH_URL: http://localhost:3000
          GITHUB_CLIENT_ID: dummy
          GITHUB_CLIENT_SECRET: dummy
          GOOGLE_CLIENT_ID: dummy
          GOOGLE_CLIENT_SECRET: dummy
          ARCJET_KEY: ajkey_dummy
          AWS_ACCESS_KEY_ID: dummy
          AWS_SECRET_ACCESS_KEY: dummy
          AWS_ENDPOINT_URL_S3: https://dummy.s3.amazonaws.com
          AWS_ENDPOINT_URL_IAM: https://dummy.iam.amazonaws.com
          AWS_REGION: us-east-1
          NEXT_PUBLIC_S3_BUCKET_NAME_IMG: dummy-bucket
          STRIPE_SECRET_KEY: sk_test_dummy
          STRIPE_WEBHOOK_SECRET: whsec_dummy
        run: pnpm build
